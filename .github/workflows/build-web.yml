name: Build DARK NIGHT Survival Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "config/**"
      - "scenes/**"
      - "scripts/**"
      - ".github/workflows/build-web.yml"

permissions:
  contents: read

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Install matching export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          if [ -d "$HOME/.local/share/godot/export_templates/4.7.2.stable/templates" ]; then
            mv "$HOME/.local/share/godot/export_templates/4.7.2.stable/templates/"* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
            rmdir "$HOME/.local/share/godot/export_templates/4.7.2.stable/templates"
          fi
      - name: Import project resources
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Export Web build
        run: |
          mkdir -p build/web
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Web" build/web/index.html
      - name: Package browser build
        run: |
          cd build
          zip -qr ../DARK-NIGHT-SURVIVAL-WEB.zip web
      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DARK-NIGHT-SURVIVAL-WEB
          path: DARK-NIGHT-SURVIVAL-WEB.zip
          if-no-files-found: error
          retention-days: 14
