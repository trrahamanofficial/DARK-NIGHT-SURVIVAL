services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: ${NAKAMA_DB_PASSWORD:?Set NAKAMA_DB_PASSWORD in server environment}
    volumes:
      - nakama-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama -d nakama"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  nakama:
    image: heroiclabs/nakama:3.22.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >
        /nakama/nakama migrate up
        --database.address nakama:${NAKAMA_DB_PASSWORD}@postgres:5432/nakama
        &&
        exec /nakama/nakama
        --name dark-night-survival
        --database.address nakama:${NAKAMA_DB_PASSWORD}@postgres:5432/nakama
        --logger.level INFO
        --runtime.path /nakama/data/modules
        --socket.server_key ${NAKAMA_SERVER_KEY:?Set NAKAMA_SERVER_KEY in server environment}
        --session.token_expiry_sec 7200
    ports:
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"
    volumes:
      - ./modules:/nakama/data/modules:ro
    restart: unless-stopped
volumes:
  nakama-postgres:
